# Blackjack: short episodes, exact DP oracle exists (docs/ENV_DESIGN.md §2).
game: blackjack
opponents: none
game_kwargs: {}
policy:
  net_arch: [64, 64]
ppo:
  learning_rate: 3.0e-4
  n_steps: 256
  batch_size: 256       # minibatches per rollout: ~40-80 gradient steps (was 1 minibatch = 4 steps)
  n_epochs: 10
  gamma: 1.0
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
evaluation:
  deterministic: true
  metric: ev
  opponent: none
  gate: {baseline: optimal, max_gap: 0.01}
profiles:
  smoke: {timesteps: 20000, pretrain_episodes: 1000, n_envs: 2, eval_every: 10000, eval_episodes: 500, snapshot_every: 0}
  full: {timesteps: 5000000, pretrain_episodes: 60000, n_envs: 4, eval_every: 250000, eval_episodes: 50000, snapshot_every: 0}
