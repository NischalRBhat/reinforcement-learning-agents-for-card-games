# Klondike: long horizon, 591 masked actions (docs/ENV_DESIGN.md §3).
game: klondike
opponents: none
game_kwargs: {}
policy:
  net_arch: [512, 512]
ppo:
  learning_rate: 2.5e-4
  n_steps: 512
  batch_size: 256       # minibatches per rollout: ~40-80 gradient steps (was 1 minibatch = 4 steps)
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
evaluation:
  deterministic: false  # sample actions: an argmax policy can loop (draw, recycle, ...)
  metric: win_rate
  opponent: none
  gate: {threshold: 0.60}   # random ~40%, System bot ~51% (with dead-end detection)
profiles:
  smoke: {timesteps: 20000, pretrain_episodes: 10, n_envs: 2, eval_every: 10000, eval_episodes: 20, snapshot_every: 0}
  full: {timesteps: 30000000, pretrain_episodes: 200, n_envs: 4, eval_every: 500000, eval_episodes: 500, snapshot_every: 0}
