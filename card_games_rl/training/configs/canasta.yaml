# Four-player partnership Canasta: self-play, team score difference + meld progress potential
# (docs/ENV_DESIGN.md §10). The learner's partner and opponents come from the self-play pool.
game: canasta
opponents: pool
opponent_mix: {recent: 0.45, old: 0.25, heuristic: 0.25, random: 0.05}  # heuristic = the evaluation opponent
game_kwargs: {}
policy:
  net_arch: [512, 512]
ppo:
  learning_rate: 2.5e-4
  n_steps: 1024
  batch_size: 512
  n_epochs: 8
  gamma: 0.999
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
evaluation:
  deterministic: true
  metric: point_diff
  opponent: heuristic
  gate: {threshold: 150}   # points per hand better than a System partnership (System vs System = 0)
profiles:
  smoke: {timesteps: 20000, pretrain_episodes: 30, n_envs: 2, eval_every: 10000, eval_episodes: 40, snapshot_every: 5000}
  full: {timesteps: 40000000, pretrain_episodes: 3000, n_envs: 4, eval_every: 500000, eval_episodes: 800, test_episodes: 2000, snapshot_every: 250000}
