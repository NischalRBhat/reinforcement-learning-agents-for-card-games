# Heads-up NLHE: self-play with opponent pool + all-in EV (docs/ENV_DESIGN.md §4).
game: poker
# Monte Carlo CFR (games/poker/cfr.py). Set algorithm: ppo for the MaskablePPO settings below.
algorithm: cfr
cfr: {save_every: 60}
opponents: pool
opponent_mix: {recent: 0.45, old: 0.25, heuristic: 0.25, random: 0.05}  # heuristic = the evaluation opponent
game_kwargs: {allin_ev: true}
policy:
  net_arch: [256, 256]
ppo:
  learning_rate: 3.0e-4
  n_steps: 512
  batch_size: 256       # minibatches per rollout: ~40-80 gradient steps (was 1 minibatch = 4 steps)
  n_epochs: 10
  gamma: 1.0
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
evaluation:
  deterministic: false  # CFR plays a mixed strategy (bluffs need randomness)
  metric: bb_per_100
  opponent: heuristic
  gate: {threshold: 10.0}
profiles:
  # CFR uses iterations / eval_every_seconds; the PPO keys apply only with algorithm: ppo.
  smoke: {iterations: 3000, eval_every_seconds: 20, timesteps: 20000, pretrain_episodes: 50, n_envs: 2, eval_every: 10000, eval_episodes: 200, snapshot_every: 5000}
  full: {iterations: 100000000, eval_every_seconds: 1200, timesteps: 30000000, pretrain_episodes: 4000, n_envs: 4, eval_every: 500000, eval_episodes: 4000, test_episodes: 20000, snapshot_every: 250000}
