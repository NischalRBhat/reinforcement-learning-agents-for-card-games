# Four-player Hearts: self-play, dense realized score (docs/ENV_DESIGN.md §7).
game: hearts
opponents: pool
opponent_mix: {recent: 0.45, old: 0.25, heuristic: 0.25, random: 0.05}  # heuristic = the evaluation opponent
game_kwargs: {}
policy:
  net_arch: [256, 256]
ppo:
  learning_rate: 3.0e-4
  n_steps: 512
  batch_size: 256       # minibatches per rollout: ~40-80 gradient steps (was 1 minibatch = 4 steps)
  n_epochs: 10
  gamma: 1.0
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
evaluation:
  deterministic: true
  metric: mean_points
  opponent: heuristic
  gate: {threshold: 6.0}
profiles:
  smoke: {timesteps: 20000, pretrain_episodes: 50, n_envs: 2, eval_every: 10000, eval_episodes: 100, snapshot_every: 5000}
  full: {timesteps: 30000000, pretrain_episodes: 8000, n_envs: 4, eval_every: 500000, eval_episodes: 2000, snapshot_every: 250000}
