# Four-player Bluff: self-play + hand-size potential (docs/ENV_DESIGN.md §6).
game: bluff
opponents: pool
opponent_mix: {recent: 0.45, old: 0.25, heuristic: 0.25, random: 0.05}  # heuristic = the evaluation opponent
game_kwargs: {}
policy:
  net_arch: [256, 256]
ppo:
  learning_rate: 3.0e-4
  n_steps: 512
  batch_size: 256       # minibatches per rollout: ~40-80 gradient steps (was 1 minibatch = 4 steps)
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02
evaluation:
  deterministic: true
  metric: win_rate
  opponent: heuristic
  gate: {threshold: 0.30}
profiles:
  smoke: {timesteps: 20000, pretrain_episodes: 20, n_envs: 2, eval_every: 10000, eval_episodes: 40, snapshot_every: 5000}
  full: {timesteps: 20000000, pretrain_episodes: 1500, n_envs: 4, eval_every: 500000, eval_episodes: 1000, snapshot_every: 250000}
